name: Discord Commit Notify

on:
  push:
    branches:
      - '*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "?? New Commit - ${{ github.repository }}",
              "description": "**${{ github.actor }}** pushed to `${{ github.ref_name }}`\n\n${{ github.event.head_commit.message }}",
              "color": 3066993,
              "fields": [
                {
                  "name": "Commit",
                  "value": "[`${{ github.sha }}`](${{ github.event.head_commit.url }})",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "`${{ github.ref_name }}`",
                  "inline": true
                }
              ]
            }]
          }' \
          $DISCORD_WEBHOOK