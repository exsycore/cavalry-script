# .github/workflows/discord-notify.yml
name: Discord Notify

on:
  push:
    branches:
      - '**'          # ทุก branch
  pull_request:
    types:
      - closed        # ดัก event ตอน PR ถูกปิด (รวม merge)

jobs:
  notify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Notify push
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "Push new",
                   "description": "**Repo:** ${{ github.repository }}\n**Branch:** `${{ github.ref_name }}`\n**by:** ${{ github.actor }}\n**Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                   "color": 3447003
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}

  notify-pr-merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify PR merged
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "PR Merged",
                   "description": "**[${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})**\n**from:** `${{ github.head_ref }}` ? `${{ github.base_ref }}`\n**by:** ${{ github.actor }}",
                   "color": 5763719
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}